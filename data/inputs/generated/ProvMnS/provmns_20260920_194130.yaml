components:
  schemas:
    Resource:
      type: object
    ErrorResponse:
      type: object
    ErrorResponseGet:
      type: object
    Scope:
      type: object
    Filter:
      type: object
    Uri:
      type: string
    ErrorResponseDefault:
      type: object
    NotifyMoiChanges:
      allOf:
        - $ref: TS28623_ComDefs.yaml#/components/schemas/NotificationHeader
      type: object
      properties:
        moiChanges:
          type: array
          items:
            $ref: '#/components/schemas/MoiChange'
      required:
        - moiChanges
    NotifyEvent: {}
    CorrelatedNotification:
      type: object
      properties:
        source:
          $ref: TS28623_ComDefs.yaml#/components/schemas/Dn
        notificationIds:
          type: array
          items:
            $ref: TS28623_ComDefs.yaml#/components/schemas/NotificationId
      required:
        - source
        - notificationIds
    Operation:
      type: string
      enum:
        - add
        - remove
        - replace
    NotifyMoiCreation:
      allOf:
        - $ref: TS28623_ComDefs.yaml#/components/schemas/NotificationHeader
    NotifyMoiDeletion:
      allOf:
        - $ref: TS28623_ComDefs.yaml#/components/schemas/NotificationHeader
      properties:
        correlatedNotifications:
          type: array
          items:
            $ref: '#/components/schemas/CorrelatedNotification'
        additionalText:
          type: string
        sourceIndicator:
          $ref: '#/components/schemas/SourceIndicator'
        attributeList:
          $ref: TS28623_ComDefs.yaml#/components/schemas/AttributeNameValuePairSet
      NotifyMoiAttributeValueChanges:
        allOf:
          - $ref: TS28623_ComDefs.yaml#/components/schemas/NotificationHeader
        properties:
          additionalText:
            type: string
          sourceIndicator:
            $ref: '#/components/schemas/SourceIndicator'
          attributeListValueChanges:
            description: For structured attributes, include all attribute fields whenever
              at least one attribute field changes value. For multi-valued attributes,
              report all attribute elements of the new value; do not report only added,
              deleted, or modified elements. Deleted attributes cannot be reported;
              when required, include all attributes of the object in the notification.
              Report changed attribute names with new values; optionally include old
              values, with new values in the first change-set item and old values
              in a second item.
            $ref: '#/components/schemas/AttributeValueChangeSet'
          correlatedNotifications:
            type: array
            items:
              $ref: '#/components/schemas/CorrelatedNotification'
        required:
          - attributeListValueChanges
    PatchItem:
      type: object
      properties:
        op:
          $ref: '#/components/schemas/PatchOperation'
        from:
          type: string
        path:
          type: string
        value: {}
      required:
        - op
        - from
        - path
        - value
    CmNotificationTypes:
      type: string
      enum:
        - notifyMOICreation
        - notifyMOIDeletion
        - notifyMOIAttributeValueChanges
        - noitifyMOIChanges
        - notifyEvent
    SourceIndicator:
      type: string
      enum:
        - RESOURCE_OPERATION
        - MANAGEMENT_OPERATION
        - SON_OPERATION
        - UNKNOWN
      description: 'RESOURCE_OPERATION — The notification was generated in response
        to an internal operation of the resource.; MANAGEMENT_OPERATION — The notification
        was generated in response to a management operation applied across the managed
        object boundary external to the managed object; SON_OPERATION — The notification
        was generated as result of a SON (Self Organising Network) process like self-configuration,
        self-optimization, self-healing etc.; UNKNOWN — It is not possible to determine
        the source of the operation. '
    ScopeType:
      type: string
      enum:
        - BASE_ONLY
        - BASE_ALL
        - BASE_NTH_LEVEL
        - BASE_SUBTREE
    PatchOperation:
      type: string
      enum:
        - add
        - replace
        - remove
        - copy
        - move
        - test
      description: add — Add operation; replace — Replace operation; remove — Remove
        operation; copy — Copy operation; move — Move operation; test — Test operation.
    Insert:
      type: string
      enum:
        - before
        - after
      description: before — The new attribute element is inserted before the attribute
        element identified by the path attribute of MoiChange; after — The new attribute
        element is inserted after the attribute element identified by the path attribute
        of MoiChange.
