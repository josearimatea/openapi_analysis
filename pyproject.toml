[project]
name = "openapi-analysis"
dynamic = ["version"]
description = "A versioned instrument to evaluate the rules bank (openapi_rulesbank) and the generated OpenAPI document (openapi_generator) against the official 3GPP OpenAPI YAML. Analysis only — never generation."
readme = "README.md"
# 3.10 floor: openapi_generator (>=3.10) must be able to depend on this package.
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "openapi-spec-validator>=0.7",
    "pydantic>=2.0",   # reports (schemas/) — the siblings already use Pydantic 2
]

[project.scripts]
openapi-analysis = "openapi_analysis.cli:main"

[project.optional-dependencies]
# HTTP adapter (api/) — kept optional so importing the library never pulls FastAPI.
api = [
    "fastapi>=0.110",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/openapi_analysis/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openapi_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
