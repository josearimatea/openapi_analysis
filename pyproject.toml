[project]
name = "openapi-analysis"
dynamic = ["version"]
description = "A versioned instrument to evaluate the rules bank (openapi_rulesbank) and the generated OpenAPI document (openapi_generator) against the official 3GPP OpenAPI YAML. Analysis only — never generation."
readme = "README.md"
# 3.10 floor: openapi_generator (>=3.10) must be able to depend on this package.
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "openapi-spec-validator>=0.7",
    "pydantic>=2.0",   # reports (schemas/) — the siblings already use Pydantic 2
]

[project.scripts]
openapi-analysis = "openapi_analysis.cli:main"

[project.optional-dependencies]
# HTTP adapter (api/) — kept optional so importing the library never pulls FastAPI.
api = [
    "fastapi>=0.110",
]
# Layer 3, the semantic judge (docs/JUDGE_PLAN.md): an LLM reading the 3GPP spec and
# the OpenAPI reference through RAG. Optional — it pulls torch and LangChain, which the
# deterministic layers do not need.
judge = [
    "qdrant-3gpp-rag",            # the shared RAG package (sibling repo), as openapi_rulesbank uses it
    "langchain-core>=1.2",
    "langchain-openai>=1.1",
    "python-dotenv>=1.0",
    # Same minor version as the shared Qdrant server (1.16.3): the client warns past
    # one minor of difference. Raise both together — see docs/RASTREIO.md.
    "qdrant-client>=1.16,<1.17",
    # Listed directly only to pin it to the CPU build below: the judge embeds short
    # queries and indexes each spec once — the CUDA build (several GB) buys nothing.
    "torch>=2.0",
]

[tool.uv.sources]
qdrant-3gpp-rag = { path = "../qdrant_3gpp_rag", editable = true }
torch = { index = "pytorch-cpu" }

# CPU-only PyTorch wheels, used for torch alone (explicit = true).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/openapi_analysis/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openapi_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
