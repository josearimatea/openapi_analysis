[project]
name = "openapi-analysis"
version = "0.1.0"
description = "A versioned instrument to measure a generated rules bank against the official OpenAPI YAML (coverage, value fidelity, defect catalogue). Analysis only — never generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
openapi-analysis = "openapi_analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openapi_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
